# Filtered by Maven: this is the only place the version is declared, and it is the value the tool
# prints in `jia doctor`, in report headers and over MCP. Before this file existed the same number
# was written twice on every release — once in pom.xml and once in Engine.VERSION — and forgetting
# the second one is how a shipped jar ends up introducing itself as the previous version.
version=${project.version}
